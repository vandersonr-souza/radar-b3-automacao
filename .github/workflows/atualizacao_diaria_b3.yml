name: Atualização Diária da B3 no Supabase

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 18:30 de Brasília, dias úteis
  workflow_dispatch:

jobs:
  atualizar_mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests yfinance pandas

      - name: Testes sem rede (param a carga se algo quebrou no código)
        run: |
          python teste_provedores.py
          python teste_coletor.py
          python teste_carga.py

      - name: Executar carga (CVM + provedores) no Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}       # opcional
          HGBRASIL_KEY: ${{ secrets.HGBRASIL_KEY }}     # opcional
          FONTE_DADOS: cvm_provedores
          PROVEDORES_ORDEM: yfinance,brapi,hgbrasil
          YF_PAUSA: "0.5"          # segundos entre ativos no Yahoo
          YF_ESPERAS: "20,60"      # esperas ao ser limitado
          YF_DISJUNTOR: "3"        # ativos seguidos limitados até desistir do Yahoo
        run: python atualiza_statusinvest.py
